# One-command Neo4j Community setup for the GraphRAG module.
#   docker compose up -d
# Browser UI: http://localhost:7474  (login: neo4j / testpassword)
# Bolt (Python driver): bolt://localhost:7687

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (Python driver connects here)
    environment:
      # username is always 'neo4j'; set the password here (change for anything real)
      NEO4J_AUTH: "neo4j/testpassword"
      # accept the license for the Community edition
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
